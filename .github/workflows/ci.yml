name: CI

on:
  push:
  pull_request:

jobs:
  # 纯函数内核的离线评测门禁：不依赖 Docker / 数据库 / LLM，任何 PR 都能快速回归。
  core-evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Run deterministic offline evaluation
        run: bash scripts/run-benchmark.sh
      - name: Guard committed benchmark report against regressions
        run: git diff --exit-code -- docs/benchmark-report.md

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment files
        working-directory: .
        run: |
          bash -n scripts/dev-up.sh
          docker compose --env-file .env.example config --quiet
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: ./mvnw test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test
